name: Build Geometry Dash APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gd-android
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        working-directory: .
        run: unzip -q gd-android.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - run: npm install
      - run: npx vite build
      - run: npx cap add android
      - run: node scripts/patch-android.mjs
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: gd-android/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gd-debug-apk
          path: gd-android/android/app/build/outputs/apk/debug/app-debug.apk
